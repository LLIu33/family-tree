# Production stack for a single VM (Oracle Always Free, RU VPS, etc.)
# Usage:
#   cp .env.example .env.prod   # then edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 50s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      SERVE_WEB: "true"
      PORT: 3000
      NEO4J_SCHEME: bolt
      NEO4J_HOST: neo4j
      NEO4J_PORT: 7687
      SWAGGER_ENABLED: "false"
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/uploads
    volumes:
      - app_uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  app_uploads:
