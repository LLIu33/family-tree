services:
  neo4j:
    image: neo4j:4.4
    container_name: familytree-neo4j
    environment:
      NEO4J_AUTH: neo4j/your_password
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: familytree-api
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEO4J_HOST: neo4j
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      - neo4j

volumes:
  neo4j_data:
  neo4j_logs:
  app_node_modules:
