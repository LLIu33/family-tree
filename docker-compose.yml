version: "3.8"

services:
  neo4j:
    image: neo4j:4.4
    container_name: familytree-neo4j
    environment:
      NEO4J_AUTH: neo4j/your_password
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  app:
    build: .
    container_name: familytree-api
    environment:
      - NODE_ENV=production
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
